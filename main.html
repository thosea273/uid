<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hound</title>

  
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!--nav--->
<nav class="nav">
  <div class="nav__left">
      <button class="nav__btn" onclick="goto('products')">SHOP ▼</button>
      <button class="nav__btn">FAQ ▼</button>
    </div>
      <div class="nav__logo" onclick="goto('home')">(hound)</div>
      <div class="nav__right">
          <span class="nav__country">AUSTRALIA ▼</span>
          <button class=" nav__icon" aria-label="Search">🔎</button>
          <button class=" nav__icon" aria-label="Account"></button>
          <button class="nav__vart" onclick="openCartDrawer()" aria-label="Open cart">
            <span class="nav__cart-badge" id="cart-badge">2</span>
            </button>
          </div>
        </nav>
      
  <!--home--->
<main class="page active" id="page-home">
  <div class="hero">
    <img src="bg.png" alt="Hound World Map"/>
    <button class="hotspot" style="left:4.2%; top: 35.7%;" onclick="goto('products')">SHOP</button>
    <button class="hotspot" style="left:30.6%; top: 25.6%;" onclick="goto('products')">COLLECTIONS</button>
    <button class="hotspot" style="left:59.4%; top: 37.1%;">FAQ</button>
    <button class="hotspot" style="left:2.8%; top: 44.5%;" onclick="goto('products')">CONTINUE SHOPPING</button>
  </div>
</main>

  <!--product page--->
  <main class="page" id="page-products">
    <div class="products__header">
      <p class="breadcrumb"><span onclick="goto('home')">HOME</span>/ ALL PRODUCTS</p>
      <h1 class="products__title">ALL PRODUCTS</h1>
      <div class="products__toolbar">
        <div class="products__toolbar-left">
          <button class="filter-btn">FILTER ▼</button>
          <span class="showing-count">SHOWING 8/8 PRODUCTS</span>
    </div>
    <button class="sort-btn">ALPHABETICALLY A-Z ▼</button>
  </div>
</div>
<div class="product-grid" id="product-grid"></div>
<footer class="footer">
  <div class="footer__newsletter">
    <p>Recieve updates first on offers, releases and more</p>
  <div class="newsletter-form">
    <input type="email" placeholder="Email address"/>
    <button type="button">SUBSCRIBE</button>
  </div>
</div>
<div class="footer__links">
  <p class="footer__links-title">ABOUT</p>
  <a>Our Story</a><a>Sustainability</a><a>Careers</a>
  </div>
</footer>
<p class="footer-copy">Copyright &copy; 2026 Hound Archives.</p>
</main>

<!--product page details--->
<main class="page" id="page-detail">
  <div class="detail__layout">
    <div class="detail__images" id="detail-images"></div>
    <div class="detail__info">
      <button class="back-btn" onclick="goto('products')">← BACK</button>
    <span class="preorder-badge" id="detail-badge">PRE-ORDER</span>
    <h1 class="detail__title" id="detail-title"></h1>
    <p class="detail__price" id="detail-price"></p>
    <div class="detail__desc" id="detail-desc"></div>
    <div class="swatch-section">
      <p class="swatch-label">COLOR<span id="swatch-label-text"></span></p>
        <div class="swatches" id="detail-swatches"></div>
      </div>
      <div class="swatch-section">
        <p class="swatch-label">SIZE</p>
        <div class="size-options" id="detail-sizes"></div>
      </div>
      <button class="preorder-btn" onclick="addToCartFromDetail()">PRE-ORDER NOW</button>
        </div>
      </div>
    </main>



    

      <div class="turun">
        <button class="turunbtn">FAQ ▼</button>
        <div class="turun-content">
          <a href="#">Tops</a>
          <a href="#">Bottoms</a>
          <a href="#">Accesories</a>
        </div>
      </div>
    </nav>
    <script src="script.js"></script>



   
















</body>
</html>
